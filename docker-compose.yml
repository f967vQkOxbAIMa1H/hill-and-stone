services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hillstone
      POSTGRES_PASSWORD: hillstone
      POSTGRES_DB: hillstone
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # Stripe's official API mock, for local checkout tests: docker compose --profile test up -d
  stripe-mock:
    image: stripe/stripe-mock:latest
    profiles: ["test"]
    ports:
      - "12111:12111"

  # S3-compatible storage for testing STORAGE_DRIVER=s3 locally
  minio:
    image: quay.io/minio/minio:latest
    profiles: ["test"]
    command: server /data
    environment:
      MINIO_ROOT_USER: hillstone
      MINIO_ROOT_PASSWORD: hillstone-minio-secret
    ports:
      - "9000:9000"

volumes:
  pgdata:
